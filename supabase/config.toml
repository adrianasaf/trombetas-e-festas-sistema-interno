# Configuração do Supabase CLI. Valores de [auth] podem ser enviados ao projeto remoto com
# `npx supabase config push` (revise antes: sobrescreve as configurações de Auth do projeto).
project_id = "trombetas-e-festas"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# O seed de demonstração NÃO roda automaticamente; use scripts/seed-demo (apenas DEV).
enabled = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
# Ajuste para a URL publicada na Vercel (e o domínio próprio em produção).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Sem cadastro público: usuários entram somente por convite.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 30

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.convidar-usuario]
verify_jwt = true
